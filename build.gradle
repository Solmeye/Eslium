plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
}

def modProps = [
        "group"                 : group,
        "id"                    : id,
        "name"                  : name,
        "version"               : version,
        "description"           : description,
        "author"                : author,
        "homepage"              : homepage,
        "sources"               : sources,
        "issues"                : issues,
        "discord"               : discord,
        "license"               : license,
        "icon"                  : icon,
        "minecraft_range"       : minecraft_range,
        "loader_version"        : loader_version,
        "min_loader_version"    : min_loader_version,
        "min_java"              : min_java
]

processResources {
    inputs.properties(modProps)

    filesMatching(["fabric.mod.json", "eslium.mixins.json"]) {
        expand(modProps)
    }
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

tasks.jar {
    archiveFileName = "${id}-${version}+${minecraft_version}.jar"
}

java {
	//withSourcesJar()
}

jar {
	def projectName = name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

loom {
    accessWidenerPath = file("src/main/resources/eslium.accesswidener")

        runs {
        client {
            programArgs "--username", "Username"
        }
    }
}