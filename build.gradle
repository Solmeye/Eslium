plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.version
group = project.group

repositories {
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

def modProps = [
        "group"                 : project.group,
        "id"                      : project.id,
        "name"                    : project.name,
        "version"                 : project.version,
        "description"                 : project.description,
        "author"                     : project.author,
        "homepage"                    : project.homepage,
        "sources"                    : project.sources,
        "issues"                    : project.issues,
        "discord"                     : project.discord,
        "license"                     : project.license,
        "icon"                        : project.icon,
        "constraint_minecraft"             : project.constraint_minecraft,
        "loader_version"              : project.loader_version,
        "constraint_fabric_loader"          : project.constraint_fabric_loader,
        "constraint_java"                    : project.constraint_java,
        "maven_minecraft"                    : project.maven_minecraft,
        "java_target"                    : project.java_target
]

processResources {
    inputs.properties(modProps)

    filesMatching(["fabric.mod.json", "quilt.mod.json", "META-INF/neoforge.mods.toml", "META-INF/mods.toml", "eslium.mixins.json"]) {
        expand(modProps)
    }
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = java_target.toInteger()
}

java {
	//withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(java_target)
	targetCompatibility = JavaVersion.toVersion(java_target)
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

loom {
    accessWidenerPath = file("src/main/resources/eslium.accesswidener")

        runs {
        client {
            programArgs "--username", "Username"
        }
    }
}

def generateAT = tasks.register("generateAT") {
    def aw = file("src/main/resources/eslium.accesswidener")
    def out = layout.buildDirectory.file("generated/at/META-INF/accesstransformer.cfg")

    inputs.file(aw)
    outputs.file(out)

    doLast {
        def lines = aw.readLines("UTF-8")
            .findAll { it && !it.startsWith("#") && !it.startsWith("accessWidener") }

        def result = lines.collect { line ->
            def p = line.trim().split(/\s+/)
            def access = p[0] == "accessible" ? "public" : "public-f"
            def owner = p[2].replace('/', '.')

            switch (p[1]) {
                case "class":
                    "$access $owner"
                    break
                case "method":
                    "$access $owner ${p[3]}${p[4]}"
                    break
                case "field":
                    "$access $owner ${p[3]}"
                    break
            }
        }

        def file = out.get().asFile
        file.parentFile.mkdirs()
        file.text = result.join("\n") + "\n"
    }
}

tasks.jar {
    archiveFileName = "${rootProject.name}-${version}+${minecraft_version}.jar"
    exclude("net/neoforged/**")
    exclude("net/minecraftforge/**")

    dependsOn(generateAT)

    from(generateAT) {
        into("META-INF")
    }
}